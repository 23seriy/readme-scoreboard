name: Update season status

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/update-season-status.js
      - name: Open season status update PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update supported league seasons"
          title: "docs: update supported league seasons"
          body: "Daily season-window refresh from the supported league APIs."
          branch: automation/season-status
          delete-branch: false
