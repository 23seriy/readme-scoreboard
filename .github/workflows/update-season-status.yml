name: Update season status

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/update-season-status.js
      - name: Publish season status branch
        run: |
          if git diff --quiet -- README.md; then
            echo "Season status is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C automation/season-status
          git add README.md
          git commit -m "docs: update supported league seasons"
          git push --force origin automation/season-status
          echo "Updated automation/season-status. Open or update a PR from that branch."
