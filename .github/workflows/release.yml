name: Publish release alias

on:
  release:
    types: [published]

permissions:
  contents: write

# Serialize alias updates. Without a shared group, two releases published close
# together both force-push `v1` at once and the loser fails with
# "cannot lock ref 'refs/tags/v1'". Queued runs still execute in order, so the
# newest release ends up owning the alias. Deliberately NOT the
# `readme-maintenance` group, so a release never waits behind scheduled README
# refreshes.
concurrency:
  group: release-major-tag
  cancel-in-progress: false

jobs:
  update-major-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - name: Update major action tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ignoring non-semver release tag: $RELEASE_TAG"
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$major" "$RELEASE_TAG" -m "Update $major to $RELEASE_TAG"
          git push origin "$major" --force
