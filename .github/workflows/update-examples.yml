name: Update example boards

on:
  schedule:
    # Ahead of the league showcase so a live failure here is visible before the
    # gallery run, which shares the readme-maintenance concurrency group.
    - cron: "5 6 * * *"
  workflow_dispatch:

concurrency:
  group: readme-maintenance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      # These boards are built from live league APIs, so they go stale on their
      # own: a new result, a shifted fixture, or a player leaving a roster all
      # change what the action would write. The CI freshness gate only holds
      # while the committed files match what the generator produces *today*, so
      # without this the gate would go red on the next data change rather than
      # the board being refreshed.
      - run: npm run examples:generate
      # Pushed straight to main rather than opened as a pull request. These are
      # generated boards reviewed by nobody in practice — the refresh pull
      # requests were merged unread 56 times and the two that were not had gone
      # stale and been closed — and waiting for a human made main disagree with
      # the generator for up to 29 hours, turning CI red for unrelated merges.
      # `ci.yml` and CodeQL both run on push, so the machine checks are unchanged.
      - name: Commit the refreshed boards
        run: |
          if git diff --quiet -- examples ':!examples/leagues'; then
            echo "Example boards are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `examples/README.md` is regenerated alongside the boards, and a
          # board that no longer generates would have been DELETED by the
          # generator — `git add -A` records that removal instead of leaving a
          # stale file behind that the freshness gate would flag forever.
          git add -A -- examples
          git commit -m "docs: refresh example boards from live data"
          # `readme-maintenance` serializes the maintenance workflows, but the
          # checkout can still predate a merge, so rebase onto main first. This
          # keeps the generated commit on top instead of creating a merge commit.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
