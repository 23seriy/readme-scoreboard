name: Update example boards

on:
  schedule:
    # Ahead of the league showcase so a live failure here is visible before the
    # gallery run, which shares the readme-maintenance concurrency group.
    - cron: "5 6 * * *"
  workflow_dispatch:

concurrency:
  group: readme-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --ignore-scripts
      # These boards are built from live league APIs, so they go stale on their
      # own: a new result, a shifted fixture, or a player leaving a roster all
      # change what the action would write. The CI freshness gate only holds
      # while the committed files match what the generator produces *today*, so
      # without this the gate would go red on the next data change rather than
      # the board being refreshed.
      - run: npm run examples:generate
      # The README "Preview" block is generated from the SAME renderer, so it
      # cannot claim to be live while showing a board from last season. It has
      # to run after examples:generate, which it reads nothing from, but both
      # write tracked files and must land in one commit.
      - run: npm run readme:preview
      - name: Open update pull request
        env:
          # `github.token`, not the `AUTOMATION_TOKEN` PAT. The PAT expired
          # (HTTP 401 from 2026-11-12), and a credential that can silently die
          # turns every refresh into a failed run nobody sees. The bot's PRs run
          # their checks normally in this repository; if GitHub ever starts
          # holding them behind an approval, the PR step below fails loudly
          # instead of retrying an expired secret at runtime.
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail here, not after the push, when the token cannot reach the API.
          # An expired or revoked PAT used to surface as a bare
          # "HTTP 401: Bad credentials" once the branch already existed, which
          # reads like a code problem and leaves the branch orphaned.
          if ! gh api user --jq .login >/dev/null 2>&1; then
            echo "::error::The workflow token cannot authenticate to GitHub. Refusing to push a branch with no pull request."
            exit 1
          fi
          # README.md is in scope because `readme:preview` rewrites the preview
          # block from the same renderer; leaving it out would commit boards
          # that disagree with the README.
          if git diff --quiet -- examples ':!examples/leagues' README.md; then
            echo "Example boards and the README preview are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Branch from CURRENT main — see update-league-showcase.yml. A PR that
          # is only `BEHIND` can never auto-merge under the strict ruleset.
          git fetch --quiet origin main
          git switch -C automation/example-boards origin/main
          # `examples/README.md` is regenerated alongside the boards, and a
          # board that no longer generates would have been DELETED by the
          # generator — `git add -A` records that removal instead of leaving a
          # stale file behind that the freshness gate would flag forever.
          git add -A -- examples
          git add -- README.md
          git commit -m "docs: refresh example boards and README preview from live data"
          git push --force origin automation/example-boards
          # Reuse the open PR when there is one, otherwise open it. A direct push
          # to main is not possible here: the repository ruleset ("main branch")
          # requires `lint`, `demo` and `CodeQL` to pass before a commit may
          # land, and those checks run on a commit only AFTER it exists, so a
          # push can never satisfy them. A pull request is the route that lets
          # the checks run first; auto-merge then lands it without waiting for a
          # human, while still honouring the ruleset.
          reason=""
          url=$(gh pr create --base main --head automation/example-boards \
            --title "docs: refresh example boards from live data" \
            --body "Automated refresh of the example boards in \`examples/\` from live league APIs." 2>&1) \
            || reason=$url
          if [ -z "$url" ] || [ -n "$reason" ]; then
            # The branch was already pushed; recover the existing PR if this run
            # merely raced another one, otherwise fail with the real reason.
            url=$(gh pr view automation/example-boards --json url --jq .url 2>/dev/null) \
              || { echo "::error::Could not open a pull request: ${reason:-unknown error}"; exit 1; }
          fi
          echo "PR: $url"
          # --auto waits for the required checks and for the branch to be up to
          # date (`strict_required_status_checks_policy` is on), then merges.
          # Swallowing this used to leave a refresh PR open forever with nothing
          # in the run summary saying auto-merge had not been enabled.
          if ! gh pr merge "$url" --squash --auto; then
            echo "::warning::Auto-merge could not be enabled for $url; merge it by hand."
          fi
