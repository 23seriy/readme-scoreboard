name: Update example boards

on:
  schedule:
    # Six times a day, roughly four hours apart. The repository's own README
    # preview is public, and a board that is merely old reads as a board that is
    # wrong: the conference seed moves as each game finishes, so a result from
    # the afternoon used to sit unexplained for ~20 hours. Every slot is at
    # least 20 minutes clear of the other refreshes (directories 06:00, gallery
    # 06:40), because the ruleset uses strict required checks and two refreshes
    # landing together leave the second PR `BEHIND`, unable to self-heal (#535).
    - cron: "20 1 * * *"
    - cron: "20 5 * * *"
    - cron: "20 9 * * *"
    - cron: "20 13 * * *"
    - cron: "40 16 * * *"
    - cron: "20 20 * * *"
  workflow_dispatch:

concurrency:
  # Shared with the other refresh workflows so they never overlap. Runs are
  # ~4 hours apart, and a queued run only delays the next by however long this
  # one takes (~5 minutes including its checks), so leaving it queued is right.
  group: readme-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      head_sha: ${{ steps.push.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --ignore-scripts
      # These boards are built from live league APIs, so they go stale on their
      # own: a new result, a shifted fixture, or a player leaving a roster all
      # change what the action would write. The CI freshness gate only holds
      # while the committed files match what the generator produces *today*, so
      # without this the gate would go red on the next data change rather than
      # the board being refreshed.
      - run: npm run examples:generate
      # The README "Preview" block is generated from the SAME renderer, so it
      # cannot claim to be live while showing a board from last season. It has
      # to run after examples:generate, which it reads nothing from, but both
      # write tracked files and must land in one commit.
      - run: npm run readme:preview
      - name: Open update pull request
        id: push
        env:
          # `github.token`, not the `AUTOMATION_TOKEN` PAT. The PAT expired
          # (HTTP 401 from 2026-11-12), and a credential that can silently die
          # turns every refresh into a failed run nobody sees. The bot's PRs run
          # their checks normally in this repository; if GitHub ever starts
          # holding them behind an approval, the PR step below fails loudly
          # instead of retrying an expired secret at runtime.
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail here, not after the push, when the token cannot reach the API.
          # An expired or revoked credential used to surface as a bare
          # "HTTP 401: Bad credentials" once the branch already existed, which
          # reads like a code problem and leaves the branch orphaned.
          # Probe an endpoint the token is actually scoped for: the identity
          # endpoint goes through GraphQL, which a scoped `GITHUB_TOKEN` (and a
          # fine-grained PAT) cannot query -- it 401s on a valid credential. The
          # repository endpoint is what these steps need.
          if ! gh api "repos/${GITHUB_REPOSITORY}" --jq .full_name >/dev/null 2>&1; then
            echo "::error::The workflow token cannot read ${GITHUB_REPOSITORY}. Check the workflow's permissions: block."
            exit 1
          fi
          # The PR's runs will be parked at `action_required` until a human
          # approves them (`first_time_contributors` vs `github-actions[bot]`).
          # Auto-merge then lands the PR on its own; see PR #527, which needed
          # one click and then merged unattended.
          # README.md is in scope because `readme:preview` rewrites the preview
          # block from the same renderer; leaving it out would commit boards
          # that disagree with the README.
          if git diff --quiet -- examples ':!examples/leagues' README.md; then
            echo "Example boards and the README preview are already current"
            exit 0
          fi
          : "${GITHUB_OUTPUT:?}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Branch from CURRENT main — see update-league-showcase.yml. A PR that
          # is only `BEHIND` can never auto-merge under the strict ruleset.
          git fetch --quiet origin main
          git switch -C automation/example-boards origin/main
          # `examples/README.md` is regenerated alongside the boards, and a
          # board that no longer generates would have been DELETED by the
          # generator — `git add -A` records that removal instead of leaving a
          # stale file behind that the freshness gate would flag forever.
          git add -A -- examples
          git add -- README.md
          git commit -m "docs: refresh example boards and README preview from live data"
          git push --force origin automation/example-boards
          # The approve job targets exactly this commit's runs.
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Reuse the open PR when there is one, otherwise open it. A direct push
          # to main is not possible here: the repository ruleset ("main branch")
          # requires `lint`, `demo` and `CodeQL` to pass before a commit may
          # land, and those checks run on a commit only AFTER it exists, so a
          # push can never satisfy them. A pull request is the route that lets
          # the checks run first; auto-merge then lands it without waiting for a
          # human, while still honouring the ruleset.
          reason=""
          url=$(gh pr create --base main --head automation/example-boards \
            --title "docs: refresh example boards from live data" \
            --body "Automated refresh of the example boards in \`examples/\` from live league APIs." 2>&1) \
            || reason=$url
          if [ -z "$url" ] || [ -n "$reason" ]; then
            # The branch was already pushed; recover the existing PR if this run
            # merely raced another one, otherwise fail with the real reason.
            url=$(gh pr view automation/example-boards --json url --jq .url 2>/dev/null) \
              || { echo "::error::Could not open a pull request: ${reason:-unknown error}"; exit 1; }
          fi
          echo "PR: $url"
          # --auto waits for the required checks and for the branch to be up to
          # date (`strict_required_status_checks_policy` is on), then merges.
          # Swallowing this used to leave a refresh PR open forever with nothing
          # in the run summary saying auto-merge had not been enabled.
          if ! gh pr merge "$url" --squash --auto; then
            echo "::warning::Auto-merge could not be enabled for $url; merge it by hand."
          fi

  # GitHub parks every run a `github-actions[bot]` pull request raises at
  # `action_required` — with ZERO jobs — under the "first-time contributors"
  # policy. The ruleset requires `lint`, `demo` and `CodeQL`, so a refresh PR
  # could never auto-merge: seen on #531/#532/#533, where auto-merge was armed
  # and nothing ever started. Approving starts the checks; it does not bypass
  # them, and the PR still has to pass all three.
  #
  # Scoped to the head commit this run pushed, so it cannot approve a human's PR.
  # The refresh workflow is not triggered by its own PR, so there is no recursion.
  approve:
    needs: update
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Approve the refresh pull request's parked runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.update.outputs.head_sha }}
        run: |
          if [ -z "$HEAD_SHA" ]; then
            echo "No refresh commit to approve."
            exit 0
          fi
          # Only this commit's runs, and only while they are parked. Any other
          # state is left alone, so a re-run cannot double-approve.
          # Numeric ids, not file names: the `Lint` workflow lives in ci.yml, and
          # CodeQL has moved between ids (a dynamic workflow and an advanced-setup
          # one), so a name-based URL 404s and a hardcoded id can go stale. These
          # are resolved from the API on every run instead: the three workflows
          # whose runs the ruleset requires.
          ids=$(gh api "repos/$GH_REPO/actions/workflows?per_page=100" \
            --jq '.workflows[] | select(.name == "Lint" or .name == "Demo smoke tests" or .name == "Code scanning") | .id')
          # Filter by the commit HERE, not with the API's head_sha query
          # parameter: that index is unreliable for runs created seconds
          # earlier. On 2026-11-25 the parked `Lint` run for 549e783 existed and
          # appeared in the unfiltered run list, yet asking the API for it by
          # commit returned nothing -- so the approve job reported success and
          # left the refresh PR blocked on a check that never started (PR #583).
          for wf in $ids; do
            gh api "repos/$GH_REPO/actions/workflows/$wf/runs?per_page=30" \
              --jq '.workflow_runs[] | "\(.head_sha) \(.conclusion) \(.id)"' \
              | awk -v sha="$HEAD_SHA" '$1 == sha && $2 == "action_required" { print $3 }' \
              | while read -r id; do
                  echo "Approving $wf run $id for $HEAD_SHA"
                  gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" || exit 1
                done
          done
          # The pull_request runs are created asynchronously, so one pass can
          # race the first-check run. Wait briefly and take a second pass; a
          # parked run left behind stalls the refresh PR until someone clicks.
          sleep 30
          for wf in $ids; do
            gh api "repos/$GH_REPO/actions/workflows/$wf/runs?per_page=30" \
              --jq '.workflow_runs[] | "\(.head_sha) \(.conclusion) \(.id)"' \
              | awk -v sha="$HEAD_SHA" '$1 == sha && $2 == "action_required" { print $3 }' \
              | while read -r id; do
                  echo "Approving (second pass) $wf run $id"
                  gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" || exit 1
                done
          done
