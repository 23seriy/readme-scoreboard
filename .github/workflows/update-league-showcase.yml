name: Update league showcase

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

concurrency:
  group: readme-maintenance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run leagues:showcase
      # Pushed straight to main rather than opened as a pull request. This
      # gallery is generated from live league APIs and reviewed by nobody in
      # practice — the refresh pull requests were merged unread 56 times and the
      # two that were not had gone stale and been closed — and waiting for a
      # human made main disagree with the generator for up to 29 hours, turning
      # CI red for unrelated merges. `ci.yml` and CodeQL both run on push.
      - name: Commit the refreshed gallery
        run: |
          if git diff --quiet -- examples/leagues; then
            echo "League showcase is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/leagues
          git commit -m "docs: refresh league showcase from live data"
          # `readme-maintenance` serializes the maintenance workflows, but the
          # checkout can still predate a merge, so rebase onto main first. This
          # keeps the generated commit on top instead of creating a merge commit.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
