name: Update league showcase

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

concurrency:
  group: readme-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run leagues:showcase
      - name: Open update pull request
        env:
          # A PAT (not `github.token`) so the PR and its commits are attributed
          # to a real user. Events raised by `github.token` are attributed to
          # `github-actions[bot]`, which the repo's `first_time_contributors`
          # approval policy holds at `action_required` — zero jobs run until a
          # human clicks approve, so auto-merge could never fire on its own.
          # Falls back to `github.token` so the workflow still refreshes the
          # branch (just with the approval click) if the secret is absent.
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
        run: |
          if git diff --quiet -- examples/leagues; then
            echo "League showcase is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C automation/league-showcase
          git add examples/leagues
          git commit -m "docs: refresh league showcase from live data"
          git push --force origin automation/league-showcase
          # Reuse the open PR when there is one, otherwise open it. A direct push
          # to main is not possible here: the repository ruleset ("main branch")
          # requires `lint`, `demo` and `CodeQL` to pass before a commit may
          # land, and those checks run on a commit only AFTER it exists, so a
          # push can never satisfy them. A pull request is the route that lets
          # the checks run first; auto-merge then lands it without waiting for a
          # human, while still honouring the ruleset.
          url=$(gh pr create --base main --head automation/league-showcase \
            --title "docs: refresh league showcase from live data" \
            --body "Automated refresh of the per-league example gallery (examples/leagues) from live league APIs.") \
            || gh pr view automation/league-showcase --json url --jq .url
          echo "PR: $url"
          # --auto waits for the required checks and for the branch to be up to
          # date (`strict_required_status_checks_policy` is on), then merges.
          gh pr merge "$url" --squash --auto \
            || echo "Auto-merge could not be enabled; leaving the PR for review."
