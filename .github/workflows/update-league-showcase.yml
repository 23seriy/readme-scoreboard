name: Update league showcase

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

concurrency:
  group: readme-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run leagues:showcase
      - name: Open update pull request
        env:
          # `github.token`, not a stored PAT: the `AUTOMATION_TOKEN` PAT expired
          # (HTTP 401 from 2026-11-12) and took this workflow down with it. A
          # credential that dies on its own schedule is worse than the approval
          # click it was meant to avoid.
          #
          # Cost, observed live on PR #527: `first_time_contributors` parks a
          # `github-actions[bot]` PR's runs at `action_required` with zero jobs,
          # so auto-merge waits for a human "Approve and run". Fine here -- the
          # gallery is cosmetic -- and the alternative (a PAT) has now failed
          # silently once. If this workflow must land unattended, re-run it via
          # `workflow_dispatch`, whose `GITHUB_ACTOR` is a real user and whose
          # PR runs then execute normally.
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail here, not after the push, when the token cannot reach the API.
          # An expired or revoked PAT used to surface as a bare
          # "HTTP 401: Bad credentials" once the branch already existed, which
          # reads like a code problem and leaves the branch orphaned.
          # Probe an endpoint the token is actually scoped for: the identity
          # endpoint goes through GraphQL, which a scoped `GITHUB_TOKEN` (and a
          # fine-grained PAT) cannot query -- it 401s on a valid credential.
          if ! gh api "repos/${GITHUB_REPOSITORY}" --jq .full_name >/dev/null 2>&1; then
            echo "::error::The workflow token cannot read ${GITHUB_REPOSITORY}. Check the workflow's permissions: block."
            exit 1
          fi
          if git diff --quiet -- examples/leagues; then
            echo "League showcase is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Branch from CURRENT main, not from whatever main was when the action
          # started. The ruleset sets `strict_required_status_checks_policy`, so
          # a PR whose branch is merely `BEHIND` cannot auto-merge — it would sit
          # there forever, because the only thing that refreshes this branch is a
          # new run of this job, and the job exits early when the artefacts are
          # unchanged. Re-basing on main every run breaks that deadlock.
          git fetch --quiet origin main
          git switch -C automation/league-showcase origin/main
          git add examples/leagues
          git commit -m "docs: refresh league showcase from live data"
          git push --force origin automation/league-showcase
          # Reuse the open PR when there is one, otherwise open it. A direct push
          # to main is not possible here: the repository ruleset ("main branch")
          # requires `lint`, `demo` and `CodeQL` to pass before a commit may
          # land, and those checks run on a commit only AFTER it exists, so a
          # push can never satisfy them. A pull request is the route that lets
          # the checks run first; auto-merge then lands it without waiting for a
          # human, while still honouring the ruleset.
          reason=""
          url=$(gh pr create --base main --head automation/league-showcase \
            --title "docs: refresh league showcase from live data" \
            --body "Automated refresh of the per-league example gallery (examples/leagues) from live league APIs.") \
            || reason=$url
          if [ -z "$url" ] || [ -n "$reason" ]; then
            url=$(gh pr view automation/league-showcase --json url --jq .url 2>/dev/null) \
              || { echo "::error::Could not open a pull request: ${reason:-unknown error}"; exit 1; }
          fi
          echo "PR: $url"
          # --auto waits for the required checks and for the branch to be up to
          # date (`strict_required_status_checks_policy` is on), then merges.
          if ! gh pr merge "$url" --squash --auto; then
            echo "::warning::Auto-merge could not be enabled for $url; merge it by hand."
          fi
