name: Update college rosters

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: college-rosters
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/update-college-abbreviations.js
      - name: Publish college roster branch
        run: |
          if git diff --quiet -- README.md; then
            echo "College rosters are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C automation/college-rosters
          git add README.md
          git commit -m "docs: update college team abbreviations"
          git fetch origin automation/college-rosters || true
          if git show-ref --verify --quiet refs/remotes/origin/automation/college-rosters; then
            git push --force-with-lease=refs/heads/automation/college-rosters:$(git rev-parse refs/remotes/origin/automation/college-rosters) origin automation/college-rosters
          else
            git push origin automation/college-rosters
          fi
      - name: Open or update college roster PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/college-rosters"
          existing_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number')
          if [[ -n "$existing_pr" ]]; then
            echo "College roster PR #$existing_pr already exists"
            exit 0
          fi
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "docs: update college team abbreviations" \
            --body "Automated NCAA abbreviation refresh from ESPN's public team directories." \
            || { echo "::error::Unable to create the maintenance PR. Enable GitHub Actions to create pull requests in repository settings."; exit 1; }
