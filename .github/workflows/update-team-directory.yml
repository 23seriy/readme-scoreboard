name: Update team directory

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

concurrency:
  group: readme-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run teams:directory
      - run: npm run teams:directory:markdown
      - run: npm run players:directory
      - run: npm run players:directory:markdown
      - run: npm run leagues:examples
      - run: npm run teams:directory:validate
      - run: npm run players:directory:validate
      - name: Open update pull request
        env:
          # See update-examples.yml: the PAT expired (HTTP 401 from
          # 2026-11-12), so the run authenticates with `github.token`.
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail here, not after the push, when the token cannot reach the API.
          # An expired or revoked PAT used to surface as a bare
          # "HTTP 401: Bad credentials" once the branch already existed, which
          # reads like a code problem and leaves the branch orphaned.
          # Probe an endpoint the token is actually scoped for: the identity
          # endpoint goes through GraphQL, which a scoped `GITHUB_TOKEN` (and a
          # fine-grained PAT) cannot query -- it 401s on a valid credential.
          if ! gh api "repos/${GITHUB_REPOSITORY}" --jq .full_name >/dev/null 2>&1; then
            echo "::error::The workflow token cannot read ${GITHUB_REPOSITORY}. Check the workflow's permissions: block."
            exit 1
          fi
          # The PR's runs will be parked at `action_required` until a human
          # approves them (`first_time_contributors` vs `github-actions[bot]`).
          # Auto-merge then lands the PR on its own; see PR #527, which needed
          # one click and then merged unattended.
          if git diff --quiet -- team-directory.json TEAM_DIRECTORY.md player-directory.json PLAYER_DIRECTORY.md LEAGUE_WORKFLOW_EXAMPLES.md; then
            echo "Team and player directories are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Branch from CURRENT main — see update-league-showcase.yml. A PR that
          # is only `BEHIND` can never auto-merge under the strict ruleset.
          git fetch --quiet origin main
          git switch -C automation/team-directory origin/main
          git add team-directory.json TEAM_DIRECTORY.md player-directory.json PLAYER_DIRECTORY.md LEAGUE_WORKFLOW_EXAMPLES.md
          git commit -m "docs: refresh team and player directories"
          git push --force origin automation/team-directory
          # Reuse the open PR when there is one, otherwise open it. A direct push
          # to main is not possible here: the repository ruleset ("main branch")
          # requires `lint`, `demo` and `CodeQL` to pass before a commit may
          # land, and those checks run on a commit only AFTER it exists, so a
          # push can never satisfy them. A pull request is the route that lets
          # the checks run first; auto-merge then lands it without waiting for a
          # human, while still honouring the ruleset.
          reason=""
          url=$(gh pr create --base main --head automation/team-directory \
            --title "docs: refresh team and player directories" \
            --body "Automated refresh of team and player names and IDs from supported league APIs.") \
            || reason=$url
          if [ -z "$url" ] || [ -n "$reason" ]; then
            url=$(gh pr view automation/team-directory --json url --jq .url 2>/dev/null) \
              || { echo "::error::Could not open a pull request: ${reason:-unknown error}"; exit 1; }
          fi
          echo "PR: $url"
          # --auto waits for the required checks and for the branch to be up to
          # date (`strict_required_status_checks_policy` is on), then merges.
          if ! gh pr merge "$url" --squash --auto; then
            echo "::warning::Auto-merge could not be enabled for $url; merge it by hand."
          fi
