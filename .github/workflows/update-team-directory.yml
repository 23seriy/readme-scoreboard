name: Update team directory

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

concurrency:
  group: readme-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run teams:directory
      - run: npm run teams:directory:markdown
      - run: npm run players:directory
      - run: npm run players:directory:markdown
      - run: npm run leagues:examples
      - run: npm run teams:directory:validate
      - run: npm run players:directory:validate
      - name: Open update pull request
        env:
          # See update-league-showcase.yml: a PAT avoids the
          # `first_time_contributors` approval gate that holds every
          # `github-actions[bot]` run at `action_required`.
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
        run: |
          if git diff --quiet -- team-directory.json TEAM_DIRECTORY.md player-directory.json PLAYER_DIRECTORY.md LEAGUE_WORKFLOW_EXAMPLES.md; then
            echo "Team and player directories are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C automation/team-directory
          git add team-directory.json TEAM_DIRECTORY.md player-directory.json PLAYER_DIRECTORY.md LEAGUE_WORKFLOW_EXAMPLES.md
          git commit -m "docs: refresh team and player directories"
          git push --force origin automation/team-directory
          # Reuse the open PR when there is one, otherwise open it. A direct push
          # to main is not possible here: the repository ruleset ("main branch")
          # requires `lint`, `demo` and `CodeQL` to pass before a commit may
          # land, and those checks run on a commit only AFTER it exists, so a
          # push can never satisfy them. A pull request is the route that lets
          # the checks run first; auto-merge then lands it without waiting for a
          # human, while still honouring the ruleset.
          url=$(gh pr create --base main --head automation/team-directory \
            --title "docs: refresh team and player directories" \
            --body "Automated refresh of team and player names and IDs from supported league APIs.") \
            || gh pr view automation/team-directory --json url --jq .url
          echo "PR: $url"
          # --auto waits for the required checks and for the branch to be up to
          # date (`strict_required_status_checks_policy` is on), then merges.
          gh pr merge "$url" --squash --auto \
            || echo "Auto-merge could not be enabled; leaving the PR for review."
