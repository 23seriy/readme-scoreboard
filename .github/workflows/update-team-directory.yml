name: Update team directory

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

concurrency:
  group: readme-maintenance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run teams:directory
      - run: npm run teams:directory:markdown
      - run: npm run players:directory
      - run: npm run players:directory:markdown
      - run: npm run leagues:examples
      - run: npm run teams:directory:validate
      - run: npm run players:directory:validate
      # These files are generated from live league APIs and reviewed by nobody in
      # practice: the refresh pull requests were merged unread 56 times, and the
      # two that were not had gone stale and been closed. Waiting for a human also
      # had a cost — a refresh pull request sat open for up to 29 hours, during
      # which the committed files no longer matched the generator and CI went red
      # for unrelated merges. The commit is therefore pushed straight to main.
      # `ci.yml` and CodeQL both run on push, so the machine checks are unchanged.
      #
      # `update-season-status.yml` keeps its pull request: it edits README.md
      # prose that a person reads, which is a different kind of review.
      - name: Commit the refreshed directories
        run: |
          files="team-directory.json TEAM_DIRECTORY.md player-directory.json PLAYER_DIRECTORY.md LEAGUE_WORKFLOW_EXAMPLES.md"
          if git diff --quiet -- $files; then
            echo "Team and player directories are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "docs: refresh team and player directories"
          # `readme-maintenance` serializes the maintenance workflows, but the
          # checkout can still predate a merge, so rebase onto main first. This
          # keeps the generated commit on top instead of creating a merge commit.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
