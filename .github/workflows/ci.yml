name: Lint
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm run docs:check
      - run: npm run lint
      - run: npm run test:coverage
      # The example boards are generated from live league APIs, so the committed
      # file can legitimately differ from a fresh run for two reasons:
      #
      #   1. the league data moved (a result, a fixture, an injury) — the daily
      #      update-examples workflow opens a refresh PR for this;
      #   2. something in the generator or renderer changed what a board says.
      #
      # Only (2) is a defect in the changed code, so this gate runs ONLY when a
      # PR touches the things that decide a board's output. Running it
      # unconditionally made every long-lived automation branch fail: those
      # branches are force-pushed by their own workflows and can be days old, so
      # regenerating them picked up data the branch predates and reported five
      # boards as stale — for PRs that only touched markdown and JSON. That is
      # noise on a required check, not a signal.
      #
      # examples/leagues is excluded on purpose: that gallery is built from live
      # data and refreshed by its own scheduled workflow, so a diff there is
      # expected and would leave this gate permanently red. A pathspec glob like
      # 'examples/*.md' is NOT narrow enough — git's '*' also matches across '/'
      # and would pull the gallery back in.
      - name: Note which files changed
        id: changed
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          # The generator, the renderers, the adapters and the league registry
          # are the only things that change what a board renders.
          if git diff --name-only "$base" HEAD -- scripts src | grep -q .; then
            echo "boards=true" >> "$GITHUB_OUTPUT"
          else
            echo "boards=false" >> "$GITHUB_OUTPUT"
            echo "No generator or renderer change; skipping the board freshness check."
          fi
      # `push` to main always checks, so a merge that staled the boards is still
      # caught even though no PR diff is available to inspect.
      - name: Check the generated example boards are current
        if: steps.changed.outputs.boards != 'false'
        run: |
          npm run examples:generate
          git diff --exit-code --stat -- examples ':!examples/leagues'
      - name: Check a src change came with a changelog entry
        run: npm run changelog:check
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
