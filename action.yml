name: "readme-scoreboard"
description: "🏆 Live sports stats on your GitHub profile README"
branding:
  icon: "activity"
  color: "orange"
inputs:
  sport:
    description: "Sport: nba, mlb, nfl, nhl, mls, epl, laliga, bundesliga, seriea, ligue1, primeiraliga, eredivisie, wnba, ligamx, brasileirao, nwsl, saudipro, j1, scottish, belgian, ucl, uel, gleague, ncaab, ncaaw, ncaaf, ncaa_hockey"
    required: false
    default: "nba"
  team:
    description: "Team abbreviation (e.g. LAL, TOR, NYR)"
    required: true
  gh_token:
    description: "Token with Contents read/write access to target_repo (required for live README updates)"
    required: false
  marker:
    description: "HTML comment marker name (default: readme-scoreboard). Use unique names for multiple scoreboards."
    required: false
    default: "readme-scoreboard"
  target_repo:
    description: "Repo to update (default: your profile repo). Format: owner/repo"
    required: false
  dry_run:
    description: "Fetch and render live data without updating a README (true/false)"
    required: false
    default: "false"
  compact:
    description: "Use a smaller README block without team logos or recent-game details (true/false)"
    required: false
    default: "false"
outputs:
  updated:
    description: "Whether the target README was changed"
    value: ${{ steps.run.outputs.updated }}
  mode:
    description: "Execution mode: live, dry-run, or preview"
    value: ${{ steps.run.outputs.mode }}
  target_repo:
    description: "Repository targeted by the action"
    value: ${{ steps.run.outputs.target_repo }}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "24"
    - run: npm ci --omit=dev --ignore-scripts
      shell: bash
      working-directory: ${{ github.action_path }}
    - id: run
      run: node src/index.js
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        SPORT: ${{ inputs.sport }}
        TEAM: ${{ inputs.team }}
        MARKER: ${{ inputs.marker }}
        TARGET_REPO: ${{ inputs.target_repo }}
        DRY_RUN: ${{ inputs.dry_run }}
        COMPACT: ${{ inputs.compact }}
